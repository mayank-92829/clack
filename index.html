<!doctype html>
<html lang="en" style="background:var(--bg,#1b1d22)">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clack</title>
    <script>
      (function() {
        document.documentElement.classList.add('preload');
        try {
          var raw = localStorage.getItem('clack.settings');
          var s = raw ? JSON.parse(raw) : null;
          var themes = {
            dusk: { bg: "#1b1d22", alt: "#24272e", sub: "#646a7a", text: "#d8dce4", main: "#e0b25c", error: "#ef6f6c", extra: "#9e4a49" },
            glacier: { bg: "#1f2630", alt: "#28313d", sub: "#5d6a80", text: "#dbe3ee", main: "#7fc4dd", error: "#e8737d", extra: "#a04b54" },
            moss: { bg: "#19201b", alt: "#222b24", sub: "#56705e", text: "#d4e2d6", main: "#93d48f", error: "#ec7a6f", extra: "#a8504a" },
            ember: { bg: "#221c1a", alt: "#2d2522", sub: "#76645b", text: "#ecdccd", main: "#f08a4b", error: "#ff6262", extra: "#b03c3c" },
            plum: { bg: "#241b28", alt: "#2f2334", sub: "#73607e", text: "#eadcf0", main: "#d98ce6", error: "#ff7088", extra: "#b04a5c" },
            lagoon: { bg: "#10272b", alt: "#173338", sub: "#4f777d", text: "#d6eeee", main: "#4fd1c5", error: "#ff7a7a", extra: "#b04f4f" },
            mono: { bg: "#121212", alt: "#1d1d1d", sub: "#5c5c5c", text: "#e6e6e6", main: "#ffffff", error: "#ff5c5c", extra: "#a33a3a" },
            paper: { bg: "#f3efe6", alt: "#e7e1d4", sub: "#a39c8e", text: "#2f2c27", main: "#c2522d", error: "#d33a3a", extra: "#9c2a2a" },
            chalk: { bg: "#fafafa", alt: "#ececec", sub: "#ababab", text: "#333333", main: "#2f6fde", error: "#e04848", extra: "#a33333" },
            sakura: { bg: "#fbeff2", alt: "#f2dde3", sub: "#c095a2", text: "#4a2f38", main: "#e05a85", error: "#d6304a", extra: "#9e2236" }
          };
          var t = (s && themes[s.theme]) || themes.dusk;
          var el = document.documentElement.style;
          for (var k in t) el.setProperty('--' + k, t[k]);
          el.backgroundColor = t.bg;
          if (s && s.font) el.setProperty('--font', '"' + s.font + '", ui-monospace, Consolas, monospace');
          if (s && s.fontSize) el.setProperty('--size', s.fontSize + 'rem');
        } catch(e) {}
        setTimeout(function() {
          document.documentElement.classList.remove('preload');
        }, 800);
      })();
    </script>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body {
        background: var(--bg, #1b1d22);
        margin: 0;
      }
      html.preload body {
        opacity: 0 !important;
        visibility: hidden !important;
      }
      body {
        opacity: 1;
        transition: opacity 0.12s ease-out;
      }
      svg { width: 20px; height: 20px; flex: none; }
      #blurMsg { display: none !important; opacity: 0 !important; }
      body.blurred #blurMsg { display: flex !important; opacity: 1 !important; }
      #blurMsg svg { width: 18px !important; height: 18px !important; }
      #titlebar[hidden] { display: none !important; }
    </style>
  </head>
  <body style="background:var(--bg,#1b1d22)">
    <div id="titlebar" data-tauri-drag-region hidden>
      <button id="wMin" title="Minimize"><svg viewBox="0 0 10 10"><path d="M1 5h8" /></svg></button>
      <button id="wMax" title="Maximize"><svg viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" rx="1" /></svg></button>
      <button id="wClose" class="close" title="Close"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" /></svg></button>
    </div>

    <header id="top" data-tauri-drag-region>
      <div class="logo"><span class="keycap">c</span><span class="wordmark">clack</span></div>
      <nav>
        <button class="icon" id="themeToggleBtn" title="Toggle Light / Default Mode"></button>
        <button class="icon" id="statsBtn" title="Stats">
          <svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V4M19 20v-10" /></svg>
        </button>
        <button class="icon" id="settingsBtn" title="Settings (Esc)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
        </button>
      </nav>
    </header>

    <div id="config"></div>

    <main id="test">
      <div id="live">
        <div class="stats"><span id="counter"></span><span id="liveWpm"></span><span id="liveAcc"></span></div>
        <button id="langLabel" title="Switch word list"></button>
      </div>
      <div id="caps" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 4l7 8h-4v5H9v-5H5z" /><path d="M9 20h6" /></svg>caps lock
      </div>
      <div id="wrap">
        <div id="words"></div>
        <div id="blurMsg" style="display:none;opacity:0;">
          <svg width="18" height="18" viewBox="0 0 24 24" style="width:18px;height:18px;"><path d="M5 3l14 8-6 2-3 6z" /></svg>click here or press any key to focus
        </div>
      </div>
      <button class="icon restart" id="restartBtn" title="Restart (Tab)">
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8" /><path d="M3 3v5h5" /></svg>
      </button>
    </main>

    <section id="result" hidden>
      <div class="r-top">
        <div class="r-big">
          <div class="r-label">wpm</div>
          <div class="r-num" id="rWpm"></div>
          <div class="r-label">acc</div>
          <div class="r-num" id="rAcc"></div>
          <div id="rPb"></div>
        </div>
        <div class="r-chart">
          <div class="legend"><span class="l-wpm">wpm</span><span class="l-raw">raw</span><span class="l-err">errors</span></div>
          <canvas id="chart"></canvas>
          <div id="tip" hidden></div>
        </div>
      </div>
      <div class="r-stats">
        <div><div class="r-label">test type</div><div class="r-val small" id="rType"></div></div>
        <div><div class="r-label">raw</div><div class="r-val" id="rRaw"></div></div>
        <div><div class="r-label">characters</div><div class="r-val" id="rChars" title="correct / incorrect / extra / missed"></div></div>
        <div><div class="r-label">consistency</div><div class="r-val" id="rCons"></div></div>
        <div><div class="r-label">time</div><div class="r-val" id="rTime"></div></div>
      </div>
      <div id="rSource"></div>
      <div class="r-actions">
        <button class="icon" id="nextBtn" title="Next test (Tab / Enter)">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></svg>
        </button>
        <button class="icon" id="repeatBtn" title="Repeat test (Shift+Tab)">
          <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4" /><path d="M3 11V9a3 3 0 0 1 3-3h15" /><path d="M7 22l-4-4 4-4" /><path d="M21 13v2a3 3 0 0 1-3 3H3" /></svg>
        </button>
        <button class="icon" id="historyBtn" title="Show typed words">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
        </button>
      </div>
      <div id="history" hidden></div>
    </section>

    <footer id="foot">
      <div class="keys"><kbd>tab</kbd> restart <span class="dot">·</span> <kbd>shift</kbd> + <kbd>tab</kbd> repeat <span class="dot">·</span> <kbd>esc</kbd> settings</div>
      <div class="foot-right">
        <button class="link" id="themeBtn"></button>
        <span class="version" id="version"></span>
      </div>
    </footer>

    <div id="celebration" hidden>
      <canvas id="confettiCanvas"></canvas>
      <div class="celebration-card">
        <div class="celebration-badge">
          <span class="popper-icon">🎉</span>
        </div>
        <h2 class="celebration-title">Test Complete!</h2>
        <div class="celebration-sparkles">✨ Awesome Job! ✨</div>
        <div class="celebration-preview" id="celebrationPreview"></div>
        <button id="viewScoreBtn" class="btn primary celebration-btn">
          <span>View Score</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7" /></svg>
        </button>
      </div>
    </div>

    <div id="modal" hidden><div class="panel" id="panel"></div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
