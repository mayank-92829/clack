[package]
name = "clack"
version = "1.0.0"
description = "An offline, minimalist typing test"
authors = ["Mayank"]
edition = "2021"

[lib]
name = "clack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
